<!-- Source of truth for the toolbar icons — the Practice Studio asterisk,
     from practice-studio-desktop/src-tauri/icons/practice-studio-mark.svg.

     Two changes from the app icon: the rounded square is full-bleed rather
     than inset, and the asterisk is scaled up to match (1024/816). macOS app
     icons need that breathing room; a 16px toolbar icon can't spare it, and
     Chrome adds its own padding anyway.

     Regenerate the PNGs with `node scripts/render-icons.mjs`. -->
